name: Socratic Math Tutor - Android CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android
    runs-on: ubuntu-latest

    steps:
      # 1. Kodni olish
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Environment tekshirish
      - name: Check project
        run: |
          echo "Checking Socratic Math Tutor project..."
          java -version
          gradle --version

      # 5. Compile
      - name: Compile Kotlin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESMOS_API_KEY: ${{ secrets.DESMOS_API_KEY }}
        run: |
          gradle compileDebugKotlin --stacktrace

      # 6. Unit test
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESMOS_API_KEY: ${{ secrets.DESMOS_API_KEY }}
        run: |
          gradle test --stacktrace

      # 7. Android lint
      - name: Run Android Lint
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESMOS_API_KEY: ${{ secrets.DESMOS_API_KEY }}
        run: |
          gradle lint --stacktrace

      # 8. Debug APK
      - name: Build Debug APK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESMOS_API_KEY: ${{ secrets.DESMOS_API_KEY }}
        run: |
          gradle assembleDebug --stacktrace

      # 9. APKni saqlash
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: socratic-math-tutor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 10. Lint report
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
